<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>RUN/HACK board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Geist:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F3EF; --navy: #08182F; --blue: #1311D1;
    --orange: #DD6A24; --gold: #F0BE2A; --sky: #3A90E6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* Night race: floodlit track after dark. A wash of light behind the leader
     board, over lane lines that fade out before they can fight the data. */
  body { font-family: 'Geist', system-ui, sans-serif; margin: 0; background: var(--navy); color: var(--paper);
         display: flex; flex-direction: column; position: relative; }
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
                 background:
                   radial-gradient(120% 70% at 50% -10%, rgba(19,17,209,0.30) 0%, rgba(8,24,47,0) 60%),
                   radial-gradient(90% 50% at 50% 110%, rgba(58,144,230,0.13) 0%, rgba(8,24,47,0) 70%); }
  /* Lane lines: only in the lower third, so the table never sits on stripes. */
  body::after { content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 55vh; z-index: 0;
                pointer-events: none; opacity: 0.75;
                background: repeating-linear-gradient(96deg, transparent 0 78px,
                            rgba(244,243,239,0.075) 78px 80px);
                -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 100%);
                mask-image: linear-gradient(to top, #000 0%, transparent 100%); }
  body > * { position: relative; z-index: 1; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 20px; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

  header { background: linear-gradient(180deg, #1a18e0 0%, var(--blue) 55%, #0f0da8 100%);
           padding: 18px 32px; display: flex; align-items: center; gap: 24px;
           border-bottom: 4px solid var(--gold); flex-wrap: wrap;
           box-shadow: 0 10px 44px rgba(19,17,209,0.42); }
  .wordmark { font-weight: 900; font-size: 34px; letter-spacing: -1.5px; white-space: nowrap; line-height: 1; }
  .wordmark .slash { color: var(--orange); }
  .powered { display: flex; align-items: center; gap: 7px; margin-top: 5px;
             font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.28em;
             text-transform: uppercase; color: rgba(244,243,239,0.55); }
  .powered img { height: 13px; display: block; }
  .eventname { font-family: 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: 0.15em;
               font-size: 13px; color: rgba(244,243,239,0.7); }
  .spacer { flex: 1; }

  /* countdown — "starting gun" style */
  #gun { display: flex; gap: 2px; align-items: stretch; }
  .gun-cell { background: rgba(8,24,47,0.55); padding: 6px 14px; text-align: center; min-width: 72px;
              border-radius: 6px; }
  .gun-cell b { display: block; font-family: 'Geist Mono', monospace; font-size: 30px; font-weight: 600; }
  .gun-cell span { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.2em;
                   color: rgba(244,243,239,0.55); text-transform: uppercase; }
  .gun-label { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em;
               text-transform: uppercase; align-self: center; margin-right: 10px; color: var(--gold); }
  .gun-final b { color: var(--orange); }

  .joincta { background: var(--gold); color: var(--navy); text-decoration: none; font-weight: 900;
             font-size: 15px; letter-spacing: -0.3px; padding: 12px 22px; border-radius: 8px;
             white-space: nowrap; align-self: center; }
  .joincta:hover { background: #ffd34d; }
  #state .cta { display: inline-block; margin-top: 22px; background: var(--gold); color: var(--navy);
                text-decoration: none; font-weight: 900; font-size: 17px; padding: 14px 28px;
                border-radius: 8px; }
  #state .cta:hover { background: #ffd34d; }

  .rulebar { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
             padding: 8px 32px; color: rgba(244,243,239,0.5); border-bottom: 1px solid rgba(244,243,239,0.1);
             display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  /* Race vitals — all three read straight off the live board data. */
  .vitals { display: flex; gap: 12px; padding: 18px 12px 14px; flex-wrap: wrap; }
  .vital { flex: 1; min-width: 150px; background: linear-gradient(180deg, rgba(244,243,239,0.075), rgba(244,243,239,0.03));
           border: 1px solid rgba(244,243,239,0.12); border-radius: 12px; padding: 12px 18px; }
  .vital span { display: block; font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.22em;
                text-transform: uppercase; color: rgba(244,243,239,0.5); }
  .vital b { display: block; font-family: 'Geist Mono', monospace; font-size: 30px; font-weight: 600;
             line-height: 1.15; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .vital.km b { color: var(--orange); }
  .vital.commits b { color: var(--sky); }
  .vital.teams b { color: var(--paper); }
  .vital i { font-style: normal; font-size: 14px; color: rgba(244,243,239,0.45); margin-left: 4px;
             letter-spacing: 0; }

  /* The board itself: an elevated surface lifted off the night background. */
  .board-card { background: linear-gradient(180deg, rgba(12,33,64,0.94), rgba(8,24,47,0.88));
                border: 1px solid rgba(244,243,239,0.13); border-radius: 14px; overflow: hidden;
                box-shadow: 0 24px 70px rgba(0,0,0,0.42); }
  table { width: 100%; border-collapse: collapse; font-size: 21px; }
  th { text-align: left; color: rgba(244,243,239,0.45); font-family: 'Geist Mono', monospace; font-size: 11px;
       text-transform: uppercase; letter-spacing: 0.15em; padding: 14px 16px 6px; font-weight: 400; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td { padding: 13px 16px; border-top: 1px solid rgba(244,243,239,0.08); }
  td.rank { color: rgba(244,243,239,0.35); width: 44px; font-family: 'Geist Mono', monospace; }
  .move { display: block; font-size: 10px; line-height: 1; margin-top: 2px; }
  .move.up { color: #4ade80; }
  .move.down { color: var(--orange); }
  /* Leader: lit from within, gold rail down the left edge. */
  tr.first td { background: linear-gradient(90deg, rgba(240,190,42,0.13), rgba(240,190,42,0.02) 60%); }
  tr.first td.rank { box-shadow: inset 3px 0 0 var(--gold); }
  tr.first td.rank, tr.first td.score { color: var(--gold); }
  tr.first td.score { text-shadow: 0 0 22px rgba(240,190,42,0.5); }
  tr.first td.team { color: #fff; }
  /* Currently running: floodlit row + a live pill. */
  tr.live td { background: rgba(74,222,128,0.07); }
  tr.live td.rank { box-shadow: inset 3px 0 0 #4ade80; }
  tr.first.live td.rank { box-shadow: inset 3px 0 0 var(--gold); }
  .livepill { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.16em;
              text-transform: uppercase; color: #4ade80; border: 1px solid rgba(74,222,128,0.5);
              border-radius: 999px; padding: 2px 8px; margin-left: 8px; vertical-align: middle;
              animation: livepulse 2.4s ease-in-out infinite; }
  @keyframes livepulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .livepill { animation: none; } }
  td.team { font-weight: 700; }
  td.score { font-weight: 900; color: var(--sky); font-size: 26px; letter-spacing: -0.5px; }
  td.perrunner { color: var(--orange); font-weight: 700; }
  td.runners { color: rgba(244,243,239,0.6); }
  td.laps, td.runners, td.perrunner { font-variant-numeric: tabular-nums; }
  .runner { color: rgba(244,243,239,0.65); font-size: 15px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .running { background: #4ade80; box-shadow: 0 0 8px #4ade80; } .stopped { background: var(--gold); } .idle { background: #333f52; }
  .lap-valid { color: #4ade80; } .lap-invalid { color: var(--orange); }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover td { background: rgba(244,243,239,0.06); }
  th:first-child, td:first-child { padding-left: 22px; }
  th:last-child, td:last-child { padding-right: 22px; }
  thead th { background: rgba(8,24,47,0.5); }

  /* phones: rank · team · runner · laps · km · score; commits + lap detail
     live on the team page a tap away */
  @media (max-width: 760px) {
    header { padding: 10px 14px; gap: 10px; }
    .wordmark { font-size: 22px; letter-spacing: -1px; }
    .powered { margin-top: 3px; }
    .powered img { height: 10px; }
    .eventname { display: none; }
    .gun-cell { min-width: 44px; padding: 3px 7px; }
    .gun-cell b { font-size: 18px; }
    .gun-cell span { font-size: 8px; }
    .gun-label { font-size: 9px; margin-right: 4px; }
    .joincta { font-size: 12px; padding: 8px 14px; border-radius: 6px; }
    .rulebar { padding: 6px 14px; font-size: 9px; gap: 4px; flex-wrap: nowrap; }
    .pacerule { display: none; }
    .ryb { display: none; }
    /* Phones: the card goes full-bleed — every horizontal pixel belongs to
       the numbers, or the score column clips. */
    main { padding: 0; }
    .vitals { gap: 6px; padding: 10px 8px 8px; }
    .vital { min-width: 0; padding: 7px 10px; border-radius: 9px; }
    .vital b { font-size: 18px; }
    .vital i { font-size: 10px; }
    .vital span { font-size: 8px; letter-spacing: 0.12em; }
    .board-card { border-radius: 0; border-left: 0; border-right: 0; box-shadow: none; }
    .livepill { display: none; }
    table { font-size: 15px; }
    th, td { padding: 8px 5px; }
    th:first-child, td:first-child { padding-left: 8px; }
    th:last-child, td:last-child { padding-right: 8px; }
    td.rank { width: 22px; }
    .runner { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
              display: inline-block; vertical-align: middle; }
    th:nth-child(5), td:nth-child(5),
    th:nth-child(6), td:nth-child(6),
    th:nth-child(7), td:nth-child(7),
    th:nth-child(8), td:nth-child(8) { display: none; }
    td.score { font-size: 16px; }
    .runner { font-size: 12px; max-width: 56px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; display: inline-block; vertical-align: middle; }
    td.team { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.team .commitline { max-width: 32vw; font-size: 9px; }
    #state { padding: 44px 16px 20px; }
    #state .big { font-size: 28px; }
    #state .sub { font-size: 10px; }
  }
  .lap-reason { font-family: 'Geist Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
                color: rgba(244,243,239,0.4); display: block; }
  .devinline { color: rgba(58,144,230,0.75) !important; }
  .devinline .devinlive { font-weight: 600; color: #4ade80; }
  .devinline .devinlive::before { content: ' · '; color: rgba(58,144,230,0.75); }
  .commitline { display: block; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 400;
                color: rgba(244,243,239,0.45); margin-top: 3px; max-width: 340px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }

  #state { text-align: center; padding: 70px 24px 30px; }
  #state .big { font-weight: 900; font-size: 44px; letter-spacing: -1px; }
  #state .big .accent { color: var(--gold); }
  #state .sub { font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.15em;
                text-transform: uppercase; color: rgba(244,243,239,0.5); margin-top: 14px; }
  #updated { color: rgba(244,243,239,0.5); }
  #updated.stale { color: var(--orange); }

</style>
</head>
<body>
<header>
  <div>
    <a href="/" style="color:inherit;text-decoration:none"><div class="wordmark">RUN<span class="slash">/</span>HACK</div></a>
    <div class="powered">Powered by <img src="/brands/02-roxfit.png" alt="ROXFIT"></div>
  </div>
  <div class="eventname" id="eventname"></div>
  <div class="spacer"></div>
  <div class="gun-label" id="gunlabel"></div>
  <div id="gun"></div>
  <a class="joincta" id="joincta" href="#" style="display:none">Join the race →</a>
</header>
<div class="rulebar">
  <span id="scoreRule">You run. You build.</span>
  <span id="updated"></span>
  <span class="pacerule">Pace rule: slower than 7'00"/km isn't running.</span>
</div>
<main>
  <div class="vitals" id="vitals" style="display:none">
    <div class="vital km"><span>Distance run</span><b id="vKm">0.0<i>km</i></b></div>
    <div class="vital commits"><span>Laps run</span><b id="vCommits">0</b></div>
    <div class="vital teams"><span>On track now</span><b id="vTeams">0<i id="vTeamsOf"></i></b></div>
  </div>
  <div id="state" style="display:none"></div>
  <div class="board-card">
    <table>
      <thead><tr>
        <th></th><th>Team</th><th>Runner</th>
        <th class="num">Laps</th><th class="num">Runners</th><th class="num">Per runner</th>
        <th class="num">Best lap</th><th class="num">Avg lap</th><th class="num">KM</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<footer id="sponsor-bar"></footer>
<script src="/sponsor-bar.js"></script>

<script>
const slug = location.pathname.split('/')[1];
let board = null;
let clockSkewMs = 0;
let lastFetchOkAt = null;
const pageOpenedAt = Date.now();

function fmtPace(s) {
  if (s == null) return '—';
  return `${Math.floor(s / 60)}'${String(Math.round(s % 60)).padStart(2, '0')}"/km`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtAgo(s) {
  if (s == null) return '';
  if (s < 90) return `${s}s ago`;
  if (s < 5400) return `${Math.round(s / 60)}m ago`;
  return `${Math.round(s / 3600)}h ago`;
}


async function tick() {
  try {
    const r = await fetch(`/api/${slug}/board`);
    if (!r.ok) return;
    board = await r.json();
    lastFetchOkAt = Date.now();
    clockSkewMs = new Date(board.serverNow).getTime() - Date.now();
    document.getElementById('eventname').textContent = board.event;
    const cta = document.getElementById('joincta');
    cta.href = `/${slug}/join`;
    cta.style.display = board.status === 'finished' ? 'none' : '';
    document.getElementById('scoreRule').innerHTML =
      '<span class="ryb">You run. You build. </span>Score = ' +
      ({ km_plus_commits: 'km + weighted commits.', km_x_commits: 'km x commits.',
         km_x_sqrt_commits: 'km x √commits.' }[board.scoreFormula] || 'distance run.');
    renderState();
    renderVitals();
    document.getElementById('rows').innerHTML = board.teams.map((t, i) => {
      const move = t.move
        ? `<span class="move ${t.move}">${t.move === 'up' ? '▲' : '▼'}</span>` : '';
      const avgCell = t.avgLap
        ? `<span>${t.avgLap.seconds}s</span><span class="lap-reason">${fmtPace(t.avgLap.paceSPerKm)}</span>`
        : '—';
      const bestCell = t.bestLap
        ? `<span class="lap-valid">${t.bestLap.seconds}s</span><span class="lap-reason">${fmtPace(t.bestLap.paceSPerKm)}</span>`
        : '—';
      const commit = t.lastCommit
        ? `<span class="commitline" title="${esc(t.lastCommit.author || '')}">↑ ${esc(t.lastCommit.message)} · ${fmtAgo(t.lastCommit.agoS)}</span>`
        : t.devin
          // Opt-in side-stat, never scored: how hard the team drove its agent.
          ? `<span class="commitline devinline">◆ ${t.devin.msgs} prompts · ${t.devin.sessions} ${
              t.devin.sessions === 1 ? 'session' : 'sessions'
            }${t.devin.active ? `<b class="devinlive">${t.devin.active} running</b>` : ''}${
              t.devin.prsOpen
                ? ` · ${t.devin.prsMerged ? `${t.devin.prsMerged}/` : ''}${t.devin.prsOpen} PR${
                    t.devin.prsOpen === 1 ? '' : 's'}${t.devin.prsMerged ? ' merged' : ''}`
                : ''
            }${t.devin.acus ? ` · ${t.devin.acus} ACU` : ''}</span>`
          : '';
      const live = t.status === 'running';
      return `<tr class="${i === 0 ? 'first' : ''} ${live ? 'live' : ''} rowlink" onclick="location.href='/${slug}/team/${t.teamId}'">
        <td class="rank">${String(i + 1).padStart(2, '0')}${move}</td>
        <td class="team">${esc(t.team)}${commit}</td>
        <td><span class="dot ${t.status}"></span><span class="runner">${t.runner ? esc(t.runner) : '—'}</span>${
          live ? '<span class="livepill">live</span>' : ''}</td>
        <td class="num laps">${t.laps}${t.invalidLaps
          ? `<span class="lap-reason">+${t.invalidLaps} void</span>` : ''}</td>
        <td class="num runners">${t.runners || '—'}</td>
        <td class="num perrunner">${t.kmPerRunner != null
          ? `${t.kmPerRunner.toFixed(1)}<span class="lap-reason">${t.lapsPerRunner} lap${
              t.lapsPerRunner === 1 ? '' : 's'} ea.</span>`
          : '—'}</td>
        <td class="num">${bestCell}</td>
        <td class="num">${avgCell}</td>
        <td class="num score">${t.km.toFixed(1)}</td>
      </tr>`;
    }).join('');
  } catch {}
}

// Race vitals: the whole field at a glance, summed from the same board data
// the table renders — no separate endpoint, no invented targets.
function renderVitals() {
  const el = document.getElementById('vitals');
  if (!board || !board.teams.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  const km = board.teams.reduce((s, t) => s + t.km, 0);
  const laps = board.teams.reduce((s, t) => s + t.laps, 0);
  const running = board.teams.filter((t) => t.status === 'running').length;
  document.getElementById('vKm').innerHTML = `${km.toFixed(1)}<i>km</i>`;
  document.getElementById('vCommits').textContent = laps;
  document.getElementById('vTeams').innerHTML = `${running}<i>/${board.teams.length} teams</i>`;
}

// Pre-race / quiet-race states. The table stays visible underneath so team
// names are on screen before the gun.
function renderState() {
  const el = document.getElementById('state');
  if (!board) {
    // never loaded: after a few seconds show an explicit no-signal state
    if (Date.now() - pageOpenedAt > 6000) {
      el.innerHTML = `<div class="big">NO <span class="accent">SIGNAL</span></div>
        <div class="sub">Can't reach the race clock — retrying…</div>`;
      el.style.display = 'block';
    }
    return;
  }
  const nothingYet = board.teams.every((t) => t.laps === 0 && !t.runner);
  if (board.status === 'paused') {
    el.innerHTML = `<div class="big">RACE <span class="accent">PAUSED</span></div>
      <div class="sub">Hold tight — laps don't count until we resume</div>`;
    el.style.display = 'block';
  } else if (board.status === 'upcoming') {
    el.innerHTML = `<div class="big">NOBODY <span class="accent">SITS DOWN</span></div>
      <div class="sub">Race hasn't started · get your team on the board</div>
      <a class="cta" href="/${slug}/join">Join or start a team →</a>`;
    el.style.display = 'block';
  } else if (board.status === 'live' && board.teams.length === 0) {
    el.innerHTML = `<div class="big">NO TEAMS <span class="accent">YET</span></div>
      <div class="sub">Be the first on the board</div>
      <a class="cta" href="/${slug}/join">Start a team →</a>`;
    el.style.display = 'block';
  } else if (board.status === 'live' && nothingYet) {
    el.innerHTML = `<div class="big">THE RACE IS <span class="accent">LIVE</span></div>
      <div class="sub">Waiting for the first runners</div>
      <a class="cta" href="/${slug}/join">Join or start a team →</a>`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function renderUpdated() {
  const el = document.getElementById('updated');
  if (!lastFetchOkAt) { el.textContent = 'Connecting…'; return; }
  const ago = Math.round((Date.now() - lastFetchOkAt) / 1000);
  const t = ago < 90 ? `${ago}s` : `${Math.round(ago / 60)}m`;
  el.textContent = ago <= 3 ? '✓ live' : ago > 20 ? `⚠ ${t}` : `✓ ${t}`;
  el.classList.toggle('stale', ago > 20);
}

function renderGun() {
  const label = document.getElementById('gunlabel');
  const gun = document.getElementById('gun');
  if (!board || (!board.startAt && !board.endAt)) { label.textContent = ''; gun.innerHTML = ''; return; }
  const now = Date.now() + clockSkewMs;
  const start = board.startAt ? new Date(board.startAt).getTime() : null;
  const end = board.endAt ? new Date(board.endAt).getTime() : null;

  let target = null;
  if (board.status === 'paused') {
    label.textContent = '';
    gun.innerHTML = '<div class="gun-cell gun-final"><b>PAUSED</b><span>hold</span></div>';
    return;
  }
  let countUp = false;
  if (start && now < start) { label.textContent = 'Starts in'; target = start; }
  else if (end && now < end) { label.textContent = 'Time left'; target = end; }
  else if (end) {
    label.textContent = '';
    gun.innerHTML = '<div class="gun-cell gun-final"><b>FINISHED</b><span>race over</span></div>';
    return;
  } else if (start) { label.textContent = 'Elapsed'; target = start; countUp = true; }
  else { label.textContent = 'Race is live'; gun.innerHTML = ''; return; }

  let s = Math.max(0, Math.floor((countUp ? now - target : target - now) / 1000));
  const parts = [['days', 86400], ['hrs', 3600], ['min', 60], ['sec', 1]].map(([u, div]) => {
    const v = Math.floor(s / div); s -= v * div; return [u, v];
  }).filter(([u, v], i, a) => v > 0 || u === 'sec' || a.slice(0, i).some(([, pv]) => pv > 0));
  gun.innerHTML = parts.map(([u, v]) =>
    `<div class="gun-cell"><b>${String(v).padStart(u === 'days' ? 3 : 2, '0')}</b><span>${u}</span></div>`).join('');
}

setInterval(tick, 3000);
setInterval(() => { renderGun(); renderUpdated(); if (!board) renderState(); }, 1000);
tick();
</script>
</body>
</html>
