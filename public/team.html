<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>RUN/HACK team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&family=Geist:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F4F3EF; --navy: #08182F; --blue: #1311D1; --orange: #DD6A24; --gold: #F0BE2A; --sky: #3A90E6; }
  * { box-sizing: border-box; }
  body { font-family: 'Geist', system-ui, sans-serif; margin: 0; background: var(--navy); color: var(--paper);
         min-height: 100vh; position: relative; }
  /* Same floodlit-track atmosphere as the board (see board.html). */
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
                 background: radial-gradient(120% 60% at 50% -10%, rgba(19,17,209,0.30) 0%, rgba(8,24,47,0) 62%); }
  body::after { content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 55vh; z-index: 0;
                pointer-events: none; opacity: 0.75;
                background: repeating-linear-gradient(96deg, transparent 0 78px,
                            rgba(244,243,239,0.075) 78px 80px);
                -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 100%);
                mask-image: linear-gradient(to top, #000 0%, transparent 100%); }
  body > * { position: relative; z-index: 1; }
  header { background: var(--blue); padding: 14px 24px; border-bottom: 3px solid var(--gold);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .wordmark { font-weight: 900; font-size: 24px; letter-spacing: -1px; line-height: 1; }
  .wordmark .slash { color: var(--orange); }
  .powered { display: flex; align-items: center; gap: 6px; margin-top: 4px;
             font-family: 'Geist Mono', monospace; font-size: 7px; letter-spacing: 0.28em;
             text-transform: uppercase; color: rgba(244,243,239,0.55); }
  .powered img { height: 11px; display: block; }
  .eventname { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em;
               text-transform: uppercase; color: rgba(244,243,239,0.7); }
  main { max-width: 900px; margin: 0 auto; padding: 28px 24px; display: grid;
         grid-template-columns: 300px 1fr; gap: 36px; }
  main > div { min-width: 0; } /* let the stats column shrink; nowrap children ellipsize instead of overflowing */
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; gap: 22px; padding: 20px 16px; }
    h1 { font-size: 30px; }
    .qr { max-width: 250px; margin: 0 auto; }
    .qr-label, #copyJoin { max-width: 278px; margin-left: auto; margin-right: auto; }
    #copyJoin { display: block; }
    .stat { padding: 8px 12px; min-width: 76px; }
    .stat b { font-size: 20px; }
  }
  .member { flex-wrap: wrap; }
  h1 { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin: 0 0 4px; }
  .mono { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em;
          text-transform: uppercase; color: rgba(244,243,239,0.5); }
  .qr { background: var(--paper); border-radius: 8px; padding: 14px; }
  .qr img { display: block; width: 100%; }
  .qr-label { text-align: center; margin-top: 10px; font-family: 'Geist Mono', monospace;
              font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(244,243,239,0.6); }
  .stats { display: flex; gap: 2px; margin: 18px 0 8px; flex-wrap: wrap; }
  .stat { background: rgba(244,243,239,0.06); padding: 10px 16px; min-width: 86px; }
  .stat b { display: block; font-family: 'Geist Mono', monospace; font-size: 24px; font-weight: 600; }
  .stat.score b { color: var(--gold); }
  .stat.best b { color: #4ade80; }
  .stat.devin b { color: var(--sky); }
  .stat span { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.2em;
               text-transform: uppercase; color: rgba(244,243,239,0.5); }
  .stat .sub { display: block; font-family: 'Geist Mono', monospace; font-size: 10px;
               color: rgba(244,243,239,0.45); margin-top: 1px; letter-spacing: 0; text-transform: none; }
  .commitline { font-family: 'Geist Mono', monospace; font-size: 11px; color: rgba(244,243,239,0.5);
                margin: 0 0 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member { display: flex; align-items: center; gap: 10px; padding: 10px 0;
            border-top: 1px solid rgba(244,243,239,0.1); }
  .member .name { font-weight: 700; flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot.active { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .dot.frozen { background: #333f52; }
  .dot.idle { background: var(--gold); }
  .tag { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.15em;
         text-transform: uppercase; color: rgba(244,243,239,0.5); }
  .ready { border: 1px solid; border-radius: 6px; padding: 10px 14px; margin: 14px 0;
           font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
           text-transform: uppercase; display: flex; gap: 16px; flex-wrap: wrap; }
  .ready.ok { color: #4ade80; border-color: #4ade80; }
  .ready.no { color: var(--gold); border-color: rgba(240,190,42,0.5); }
  .ready .item.done { color: #4ade80; }
  .ready .item.todo { color: var(--gold); }
</style>
</head>
<body>
<header>
  <div>
    <a href="/" style="color:inherit;text-decoration:none"><div class="wordmark">RUN<span class="slash">/</span>HACK</div></a>
    <div class="powered">Powered by <img src="/brands/02-roxfit.png" alt="ROXFIT"></div>
  </div>
  <div class="eventname" id="eventname"></div>
</header>
<main>
  <div>
    <div class="qr"><img id="qr" alt="team join QR"></div>
    <div class="qr-label">Scan to run for this team</div>
    <button id="copyJoin" style="width:100%;margin-top:10px;padding:9px;font-family:'Geist Mono',monospace;
      font-size:10px;letter-spacing:0.15em;text-transform:uppercase;background:transparent;
      color:rgba(244,243,239,0.7);border:1px solid rgba(244,243,239,0.3);border-radius:4px;cursor:pointer">
      Copy join link</button>
  </div>
  <div>
    <h1 id="teamname"></h1>
    <div class="mono" id="repo"></div>
    <div class="ready" id="ready" style="display:none"></div>
    <div class="stats">
      <div class="stat score"><b id="score">0</b><span>score</span></div>
      <div class="stat"><b id="laps">0</b><span>laps</span><span class="sub" id="invalids"></span></div>
      <div class="stat"><b id="km">0.0</b><span>km</span></div>
      <div class="stat"><b id="commits">0</b><span>commits</span><span class="sub" id="committers"></span></div>
      <div class="stat devin" id="devinStat" style="display:none"><b id="devinMsgs">0</b><span>devin prompts</span><span class="sub" id="devinSessions"></span></div>
      <div class="stat best"><b id="bestlap">—</b><span>best lap</span><span class="sub" id="bestpace"></span></div>
      <div class="stat"><b id="avglap">—</b><span>avg lap</span><span class="sub" id="avgpace"></span></div>
      <div class="stat"><b id="lastlap">—</b><span>last lap</span><span class="sub" id="lastpace"></span></div>
    </div>
    <div class="commitline" id="commitline" style="display:none"></div>
    <div class="mono" style="margin-bottom:6px">Runners</div>
    <div id="members"></div>
    <div class="mono" style="margin:22px 0 6px">Tracking devices</div>
    <div id="devices"></div>
  </div>
</main>
<script>
const [, slug, , teamId] = location.pathname.split('/');
const joinUrl = `${location.origin}/${slug}/join?team=${teamId}`;
document.getElementById('qr').src = `/qr.svg?text=${encodeURIComponent(joinUrl)}`;
document.getElementById('copyJoin').onclick = (e) => {
  navigator.clipboard?.writeText(joinUrl).then(() => {
    e.target.textContent = 'Copied ✓';
    setTimeout(() => (e.target.textContent = 'Copy join link'), 1200);
  }, () => prompt('Copy:', joinUrl));
};
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let everLoaded = false;
async function tick() {
  try {
    const r = await fetch(`/api/${slug}/team/${teamId}`);
    if (!r.ok) {
      if (!everLoaded) document.getElementById('teamname').textContent = 'Team not found';
      return;
    }
    everLoaded = true;
    const t = await r.json();
    document.getElementById('eventname').textContent = t.event;
    document.getElementById('teamname').textContent = t.team;
    document.getElementById('repo').textContent = t.repo ? t.repo.replace('https://github.com/', 'github.com/') : '';
    const rd = t.readiness;
    if (rd) {
      const el = document.getElementById('ready');
      el.style.display = '';
      el.className = 'ready ' + (rd.ready ? 'ok' : 'no');
      const item = (done, label) => `<span class="item ${done ? 'done' : 'todo'}">${done ? '✓' : '○'} ${label}</span>`;
      // The github row only appears once a repo is set — it's optional now.
      el.innerHTML = rd.ready
        ? `<b>READY TO RACE</b>` +
          item(true, `${rd.members} runners`) + item(true, 'device connected') +
          (rd.repoSet ? item(true, 'github connected') : '')
        : item(rd.members >= rd.minMembers, `runners ${rd.members}/${rd.minMembers}`) +
          item(rd.devicesConnected >= 1, 'device connected') +
          (rd.repoSet ? item(rd.githubConnected, 'github verified') : '');
    }
    const pace = (s) => s == null ? '' : `${Math.floor(s / 60)}'${String(Math.round(s % 60)).padStart(2, '0')}"/km`;
    laps.textContent = t.laps; km.textContent = t.km.toFixed(1);
    commits.textContent = t.commits; score.textContent = t.score;
    invalids.textContent = t.invalidLaps ? `+${t.invalidLaps} invalid` : '';
    committers.textContent = t.committers ? `${t.committers} committing` : '';
    // Opt-in bragging stat; hidden entirely for teams that didn't register a Devin email.
    const dv = document.getElementById('devinStat');
    if (t.devin) {
      dv.style.display = '';
      document.getElementById('devinMsgs').textContent = t.devin.messages;
      document.getElementById('devinSessions').textContent =
        `${t.devin.sessions} ${t.devin.sessions === 1 ? 'session' : 'sessions'}`;
    } else dv.style.display = 'none';
    bestlap.textContent = t.bestLapS != null ? t.bestLapS + 's' : '—';
    bestpace.textContent = pace(t.bestPaceSPerKm);
    avglap.textContent = t.avgLapS != null ? t.avgLapS + 's' : '—';
    avgpace.textContent = pace(t.avgPaceSPerKm);
    lastlap.textContent = t.lastLapS != null ? t.lastLapS + 's' : '—';
    lastpace.textContent = pace(t.lastPaceSPerKm);
    const cl = document.getElementById('commitline');
    if (t.lastCommit) {
      cl.style.display = '';
      const ago = t.lastCommit.agoS != null ? ` · ${Math.round(t.lastCommit.agoS / 60)}m ago` : '';
      cl.textContent = `↑ ${t.lastCommit.message}${t.lastCommit.author ? ' — ' + t.lastCommit.author : ''}${ago}`;
    } else cl.style.display = 'none';
    document.getElementById('members').innerHTML = t.members.map((m) =>
      `<div class="member"><span class="dot idle"></span>
        <span class="name">${esc(m.name)}</span>
        <span class="tag">${m.laps} ${m.laps === 1 ? 'lap' : 'laps'}${m.bestLapS != null ? ` · best ${m.bestLapS}s` : ''}</span></div>`
    ).join('') || '<div class="tag">Nobody yet — scan the QR</div>';

    document.getElementById('devices').innerHTML = (t.devices || []).map((d) => {
      const stale = d.lastPingAgoS == null || d.lastPingAgoS > 60;
      const cls = d.active && !stale ? 'active' : 'frozen';
      let tag = d.active ? (stale ? 'on board · quiet' : `on board · ping ${d.lastPingAgoS}s`)
        : d.connected ? (stale ? 'connected · quiet' : 'connected') : 'never pinged';
      if (d.battery != null) tag += ` · 🔋${Math.round(d.battery)}%${d.charging ? '⚡' : ''}`;
      const btn = d.active ? '' :
        `<button onclick="makeActive(${d.id})" title="laps always count from any phone — this just sets whose name shows on the board"
           style="font-family:'Geist Mono',monospace;font-size:9px;
           letter-spacing:0.12em;text-transform:uppercase;background:transparent;color:var(--gold);
           border:1px solid rgba(240,190,42,0.5);border-radius:4px;padding:5px 10px;cursor:pointer">Show on board</button>`;
      return `<div class="member"><span class="dot ${cls}"></span>
        <span class="name" style="font-weight:400">${esc(d.label)}</span>
        <span class="tag">${d.laps} laps · ${tag}</span>${btn}</div>`;
    }).join('') || '<div class="tag">No devices yet — set one up from the join page</div>';
  } catch {
    if (!everLoaded) document.getElementById('teamname').textContent = 'No connection — retrying…';
  }
}
async function makeActive(id) {
  await fetch(`/api/devices/${id}/activate`, { method: 'POST' });
  tick();
}
setInterval(tick, 3000);
tick();
</script>
</body>
</html>
